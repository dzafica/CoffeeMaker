<html>

<head>
    <title>Coffee Maker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="./img/favIcon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        /* Add these styles */
        #levelSelection {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #startButton {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            background-color: #2a2a2a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 200px;
            text-align: center;
        }

        #startButton:hover {
            background-color: #191919;
        }

        .level-btn {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            background-color: #2a2a2a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 200px;
            text-align: center;
        }

        .level-btn:hover {
            background-color: #1e1e1e;
        }

        #special:hover {
            background-color: rgb(72, 0, 72) !important;
        }

        #startScreen {
            display: none;
            /* Hide start screen by default */
        }

        /*timer*/
        #gameTimer {
            position: absolute;
            /* Adjust these values to position the timer */

            left: 43%;
            top: 19.1%;
            width: 270px;
            z-index: 15;
            /* Above the canvas but below menus */
            background-color: rgb(14, 14, 14, 1);
            /*padding: 10px 20px;*/
            border-radius: 5px;
            border: 2px solid #2a2a2a;
        }

        #timerDisplay {
            margin-left: 30px;
            text-align: center;
            color: white;
            font-size: 80px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="gameTimer">
        <span id="timerDisplay">00:00</span>
    </div>
    <div class="wrapper-center">
        <div class="coffee-machine-container">
            <img src="img/CoffeeMachine.png" class="coffee-machine-bg" alt="Coffee Maker">
            <!--<img src="img/cup.png" id="coffeeCup" alt="Coffee Cup">-->
            <div id="bricks">
                <div id="levelSelection">
                    <h2 style="color: white; margin-bottom: 30px;">SELECT DIFFICULTY</h2>
                    <button class="level-btn" data-level="easy">EASY</button>
                    <button class="level-btn" data-level="medium">MEDIUM</button>
                    <button class="level-btn" data-level="hard">HARD</button>
                    <button class="level-btn" id="special" data-level="special">PLAY SPECIAL</button>
                </div>
                <div id="startScreen">
                    <button id="startButton">START</button>
                    <div id="countdown"></div>
                </div>
                <canvas id="myCanvas" width="693" height="500"></canvas>
                
            </div>
            <button id="credits" style="height: 2px; width: 2px;">.</button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/game.js"></script>

    <script>
        // Add event listener to the "C" in "Cat Adventure"
        document.getElementById('credits').addEventListener('click', function () {
            Swal.fire({
                title: 'Credits time!',
                html: `
                    <p>Game developed by <strong>Anida Džafić</strong></p>
                `,
                icon: 'info',
                confirmButtonText: 'Close',
                confirmButtonColor: '#1e3620', // Customize the button color
                backdrop: false, // Disable the backdrop
                allowOutsideClick: true, // Allow closing the popup by clicking outside
                allowEscapeKey: true, // Allow closing the popup with the Escape key
                allowEnterKey: true, // Allow closing the popup with the Enter key
                customClass: {
                    popup: 'custom-swal-popup',
                    confirmButton: 'custom-swal-confirm-button',
                    icon: 'custom-swal-icon'
                }
            });
        });
    </script>
</body>

</html>
